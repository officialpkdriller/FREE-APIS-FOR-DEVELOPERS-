<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pkdriller · free apis for developers</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#080b14;
    --panel:#0e1424;
    --panel2:#131a2e;
    --border:#1e2a48;
    --accent:#5b7cff;
    --accent2:#a855f7;
    --text:#eaf0ff;
    --muted:#8b97bd;
    --green:#4ade80;
  }
  body {
    background: radial-gradient(circle at 15% 10%, #121a33 0%, #080b14 60%);
    font-family:'Inter',sans-serif;
    color:var(--text);
    min-height:100vh;
  }

  /* ===== TOP BAR ===== */
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:1rem 2rem;
    background:rgba(10,14,26,0.85);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:50;
    flex-wrap:wrap; gap:1rem;
  }
  .brand { display:flex; align-items:center; gap:14px; }
  .avatar {
    width:48px; height:48px; border-radius:14px;
    background:linear-gradient(135deg,#5b7cff,#a855f7,#ec4899);
    padding:2px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 20px -4px #5b7cff;
  }
  .avatar img, .avatar i {
    width:100%; height:100%; border-radius:12px; object-fit:cover;
    background:#0b0f1c; display:flex; align-items:center; justify-content:center;
    font-size:1.5rem; color:#fff;
  }
  .brand h1 {
    font-family:'Space Grotesk'; font-size:1.4rem; font-weight:700;
    background:linear-gradient(90deg,#dbe4ff,#a5b8ff,#c4a5ff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .brand small { color:var(--muted); font-size:0.75rem; }

  .top-stats { display:flex; gap:0.7rem; flex-wrap:wrap; }
  .pill {
    background:var(--panel); border:1px solid var(--border);
    padding:0.5rem 0.9rem; border-radius:30px;
    font-size:0.78rem; display:flex; align-items:center; gap:8px;
    color:var(--muted); font-weight:500;
  }
  .pill i { color:var(--accent); }
  .pill b { color:#fff; font-family:'Space Grotesk'; }

  /* ===== LAYOUT ===== */
  .layout { display:flex; min-height:calc(100vh - 78px); }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width:250px; flex-shrink:0;
    background:rgba(10,15,28,0.7);
    border-right:1px solid var(--border);
    padding:1.5rem 1rem;
    overflow-y:auto;
    backdrop-filter:blur(10px);
  }
  .sidebar-title {
    font-size:0.7rem; text-transform:uppercase; letter-spacing:1.5px;
    color:var(--muted); font-weight:700; padding:0 0.8rem; margin-bottom:0.8rem;
  }
  .nav-item {
    display:flex; align-items:center; gap:12px;
    padding:0.75rem 0.9rem; border-radius:12px;
    color:#c3cdee; font-weight:500; font-size:0.9rem;
    cursor:pointer; margin-bottom:4px;
    transition:all 0.15s; border:1px solid transparent;
  }
  .nav-item i { width:20px; text-align:center; font-size:0.95rem; color:var(--accent); }
  .nav-item:hover { background:var(--panel2); color:#fff; }
  .nav-item.active {
    background:linear-gradient(90deg,rgba(91,124,255,0.2),transparent);
    border:1px solid rgba(91,124,255,0.4);
    color:#fff;
  }
  .nav-item.active i { color:#a5b8ff; }
  .nav-item .count {
    margin-left:auto; font-size:0.7rem; background:var(--panel);
    padding:2px 8px; border-radius:20px; color:var(--muted);
  }

  /* ===== MAIN ===== */
  .main { flex:1; padding:2rem; max-width:100%; overflow-x:hidden; }
  .page-header { margin-bottom:1.5rem; }
  .page-header h2 {
    font-family:'Space Grotesk'; font-size:1.8rem; font-weight:700;
    display:flex; align-items:center; gap:12px;
  }
  .page-header h2 i { color:var(--accent); }
  .page-header p { color:var(--muted); font-size:0.9rem; margin-top:6px; }

  /* ===== API GRID ===== */
  .api-grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:1.2rem;
  }
  .api-card {
    background:linear-gradient(160deg,var(--panel),#0a0f1d);
    border:1px solid var(--border); border-radius:18px;
    padding:1.3rem; display:flex; flex-direction:column;
    transition:all 0.2s; position:relative; overflow:hidden;
  }
  .api-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    opacity:0; transition:opacity 0.2s;
  }
  .api-card:hover { border-color:#2e3f6e; transform:translateY(-3px); box-shadow:0 20px 40px -20px #000; }
  .api-card:hover::before { opacity:1; }

  .api-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:0.7rem; }
  .api-name { font-family:'Space Grotesk'; font-weight:600; font-size:1.1rem; display:flex; align-items:center; gap:8px; }
  .api-name i { color:var(--accent); font-size:1rem; }
  .api-cat {
    font-size:0.65rem; text-transform:uppercase; letter-spacing:0.5px;
    background:rgba(91,124,255,0.12); color:#a5b8ff;
    padding:3px 10px; border-radius:20px; font-weight:700;
    border:1px solid rgba(91,124,255,0.25);
  }
  .api-desc { color:var(--muted); font-size:0.85rem; line-height:1.5; margin-bottom:1rem; flex:1; }
  .api-url {
    font-family:monospace; font-size:0.7rem; color:#8fa5ff;
    background:#070b14; padding:0.5rem 0.7rem; border-radius:8px;
    margin-bottom:1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    border:1px solid #182240;
  }
  .api-actions { display:flex; gap:0.6rem; align-items:center; }
  .run-btn {
    flex:1; background:linear-gradient(135deg,#2a3d80,#1a2450);
    border:1px solid #3f5fd6; color:#dbe4ff; font-weight:600;
    padding:0.6rem; border-radius:10px; cursor:pointer;
    font-size:0.85rem; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:all 0.15s; font-family:'Inter';
  }
  .run-btn:hover { background:linear-gradient(135deg,#3f5fd6,#5b7cff); color:#fff; box-shadow:0 8px 20px -8px #5b7cff; }
  .run-btn:disabled { opacity:0.6; cursor:wait; }

  /* ===== MODAL ===== */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(4,6,12,0.85);
    backdrop-filter:blur(6px); z-index:1000;
    display:none; align-items:center; justify-content:center; padding:1.5rem;
  }
  .modal-overlay.show { display:flex; }
  .modal {
    background:linear-gradient(160deg,#0f1628,#0a0f1d);
    border:1px solid var(--border); border-radius:20px;
    width:100%; max-width:720px; max-height:80vh;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 40px 80px -20px #000;
    animation:slideUp 0.25s ease;
  }
  @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .modal-head {
    display:flex; justify-content:space-between; align-items:center;
    padding:1.2rem 1.5rem; border-bottom:1px solid var(--border);
  }
  .modal-head h3 { font-family:'Space Grotesk'; font-size:1.15rem; display:flex; align-items:center; gap:10px; }
  .modal-head h3 i { color:var(--accent); }
  .close-btn {
    background:transparent; border:none; color:var(--muted);
    font-size:1.3rem; cursor:pointer; width:34px; height:34px;
    border-radius:8px; transition:all 0.15s;
  }
  .close-btn:hover { background:var(--panel2); color:#fff; }
  .modal-body { padding:1.5rem; overflow-y:auto; }
  .modal-meta {
    display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:1rem;
    font-size:0.78rem;
  }
  .meta-tag {
    background:var(--panel); border:1px solid var(--border);
    padding:4px 12px; border-radius:20px; color:var(--muted);
    display:flex; align-items:center; gap:6px;
  }
  .meta-tag.ok { color:var(--green); border-color:rgba(74,222,128,0.3); }
  .meta-tag.err { color:#f87171; border-color:rgba(248,113,113,0.3); }
  .response-box {
    background:#050810; border:1px solid #182240; border-radius:12px;
    padding:1rem; font-family:'JetBrains Mono', monospace;
    font-size:0.8rem; color:#c6d2f0; max-height:400px;
    overflow:auto; white-space:pre-wrap; word-break:break-word;
    line-height:1.5;
  }
  .response-box img { max-width:100%; border-radius:8px; margin-top:8px; }
  .loading-spin { text-align:center; padding:2rem; color:var(--muted); }
  .loading-spin i { font-size:2rem; color:var(--accent); margin-bottom:1rem; }

  /* ===== FOOTER ===== */
  .footer {
    padding:1.5rem 2rem; border-top:1px solid var(--border);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:1rem;
    background:rgba(10,14,26,0.6);
  }
  .footer a {
    color:#c3cdee; text-decoration:none; font-weight:500;
    display:inline-flex; align-items:center; gap:8px; font-size:0.9rem;
    margin-right:1.5rem; transition:color 0.15s;
  }
  .footer a i { color:var(--accent); font-size:1.1rem; }
  .footer a:hover { color:#fff; }
  .footer small { color:var(--muted); font-size:0.8rem; }

  /* ===== TOAST ===== */
  .toast {
    position:fixed; bottom:2rem; right:2rem;
    background:#0f1628; border:1px solid var(--accent);
    border-radius:12px; padding:0.8rem 1.3rem;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 20px 40px -10px #000;
    transform:translateY(150%); transition:transform 0.25s;
    z-index:2000; font-size:0.85rem;
  }
  .toast.show { transform:translateY(0); }
  .toast i { color:var(--green); }

  /* mobile */
  @media (max-width:820px) {
    .layout { flex-direction:column; }
    .sidebar {
      width:100%; border-right:none; border-bottom:1px solid var(--border);
      display:flex; overflow-x:auto; padding:0.8rem;
    }
    .sidebar-title { display:none; }
    .nav-item { flex-shrink:0; margin-bottom:0; }
    .nav-item .count { display:none; }
    .main { padding:1.2rem; }
  }
</style>
</head>

<script>
(() => {
  // ========= STATE =========
  let totalRequests = 0;
  let totalVisitors = 1;
  const startTime = Date.now();
  const requestCounts = {};

  // ========= TOP BAR STATS =========
  const netEl = document.getElementById('netStatus');
  const clockEl = document.getElementById('clock');
  const batEl = document.getElementById('battery');
  const runEl = document.getElementById('runtime');
  const reqEl = document.getElementById('requests');
  const visEl = document.getElementById('visitors');

  function updateNet() {
    netEl.textContent = navigator.onLine ? 'Online' : 'Offline';
    netEl.style.color = navigator.onLine ? '#4ade80' : '#f87171';
  }
  window.addEventListener('online', updateNet);
  window.addEventListener('offline', updateNet);
  updateNet();

  function updateClock() {
    const d = new Date();
    clockEl.textContent = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  }
  setInterval(updateClock, 1000); updateClock();

  if (navigator.getBattery) {
    navigator.getBattery().then(b => {
      const upd = () => batEl.textContent = Math.round(b.level*100) + '%' + (b.charging?' ⚡':'');
      upd(); b.addEventListener('levelchange', upd); b.addEventListener('chargingchange', upd);
    });
  } else batEl.textContent = 'N/A';

  function updateRuntime() {
    const s = Math.floor((Date.now()-startTime)/1000);
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
    runEl.textContent = (h?h+'h ':'') + (m?m+'m ':'') + sec + 's';
  }
  setInterval(updateRuntime, 1000); updateRuntime();

  reqEl.textContent = totalRequests;
  visEl.textContent = totalVisitors;

  // ========= API DATABASE =========
  const apis = [
    // --- AI ---
    { name:'Pollinations AI', cat:'ai', icon:'fa-robot', desc:'Free AI text generation, no key', url:'https://text.pollinations.ai/What%20is%20the%20capital%20of%20Kenya' },
    { name:'Pollinations Image', cat:'ai', icon:'fa-image', desc:'AI image generation (returns image URL)', url:'https://image.pollinations.ai/prompt/a%20cute%20cat' },
    { name:'YesNo AI', cat:'ai', icon:'fa-question', desc:'Yes/No answers with GIF', url:'https://yesno.wtf/api' },

    // --- Downloaders ---
    { name:'HTTPBin JSON', cat:'downloaders', icon:'fa-download', desc:'Test download endpoints', url:'https://httpbin.org/json' },
    { name:'HTTPBin Bytes', cat:'downloaders', icon:'fa-file-arrow-down', desc:'Download random bytes', url:'https://httpbin.org/bytes/16' },
    { name:'DummyJSON Products', cat:'downloaders', icon:'fa-box', desc:'Sample product data for testing', url:'https://dummyjson.com/products/1' },

    // --- Utility ---
    { name:'IPify', cat:'utility', icon:'fa-network-wired', desc:'Get your public IP address', url:'https://api.ipify.org?format=json' },
    { name:'JSONPlaceholder', cat:'utility', icon:'fa-database', desc:'Fake REST API for testing', url:'https://jsonplaceholder.typicode.com/todos/1' },
    { name:'Random User', cat:'utility', icon:'fa-user', desc:'Generate random user profile', url:'https://randomuser.me/api/' },
    { name:'UUID Generator', cat:'utility', icon:'fa-fingerprint', desc:'Generate random UUID', url:'https://httpbin.org/uuid' },
    { name:'QR Code Generator', cat:'utility', icon:'fa-qrcode', desc:'Generate QR code as PNG (returns image)', url:'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=HelloPKDriller' },

    // --- Weather ---
    { name:'Open-Meteo Nairobi', cat:'weather', icon:'fa-cloud-sun', desc:'Free weather, no key needed', url:'https://api.open-meteo.com/v1/forecast?latitude=-1.29&longitude=36.82&current_weather=true' },
    { name:'Open-Meteo London', cat:'weather', icon:'fa-cloud', desc:'London current weather', url:'https://api.open-meteo.com/v1/forecast?latitude=51.5&longitude=-0.12&current_weather=true' },
    { name:'US Weather (NWS)', cat:'weather', icon:'fa-temperature-high', desc:'US National Weather Service', url:'https://api.weather.gov/points/39.7456,-97.0892' },

    // --- Crypto ---
    { name:'CoinDesk BTC', cat:'crypto', icon:'fa-bitcoin', desc:'Bitcoin Price Index', url:'https://api.coindesk.com/v1/bpi/currentprice.json' },

    { name:'Binance Ticker', cat:'crypto', icon:'fa-chart-line', desc:'BTC/USDT live ticker', url:'https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT' },

    { name:'Unsplash Source', cat:'images', icon:'fa-mountain', desc:'Random nature image', url:'https://source.unsplash.com/400x300/?nature' },

    // --- Quotes ---
    { name:'Quotable', cat:'quotes', icon:'fa-quote-left', desc:'Random famous quote', url:'https://api.quotable.io/random' },
    { name:'ZenQuotes', cat:'quotes', icon:'fa-spa', desc:'Daily inspirational quote', url:'https://zenquotes.io/api/random' },

    // --- Translation ---
    { name:'MyMemory Translate', cat:'translate', icon:'fa-language', desc:'Translate text, no key', url:'https://api.mymemory.translated.net/get?q=Hello%20world&langpair=en|sw' },

    { name:'GitHub User', cat:'github', icon:'fa-github', desc:'Get GitHub user info', url:'https://api.github.com/users/pkdriller' },

  // Category metadata
  const categories = [

    { id:'utility', name:'Utility', icon:'fa-tools' },
    { id:'weather', name:'Weather', icon:'fa-cloud-sun' },
    { id:'crypto', name:'Crypto', icon:'fa-bitcoin' },
    { id:'fun', name:'Fun', icon:'fa-face-laugh' },
    { id:'news', name:'News', icon:'fa-newspaper' },
    { id:'geo', name:'Geo', icon:'fa-globe' },
    { id:'images', name:'Images', icon:'fa-image' },
    { id:'quotes', name:'Quotes', icon:'fa-quote-left' },
    { id:'translate', name:'Translate', icon:'fa-language' },
    { id:'github', name:'GitHub', icon:'fa-github' },
  ];

  // ========= RENDER SIDEBAR =========
  const sidebar = document.getElementById('sidebar');
  function renderSidebar() {
    const title = document.createElement('div');
    title.className = 'sidebar-title';
    title.textContent = 'Categories';
    sidebar.innerHTML = '';
    sidebar.appendChild(title);

    categories.forEach(c => {
      const count = c.id === 'all' ? apis.length : apis.filter(a => a.cat === c.id).length;
      const item = document.createElement('div');
      item.className = 'nav-item' + (c.id === currentCat ? ' active' : '');
      item.dataset.cat = c.id;
      item.innerHTML = `<i class="fas ${c.icon}"></i> <span>${c.name}</span> <span class="count">${count}</span>`;
      item.addEventListener('click', () => selectCategory(c.id));
      sidebar.appendChild(item);
    });
  }

  // ========= RENDER APIs =========
  const apiGrid = document.getElementById('apiGrid');
  const pageTitle = document.getElementById('pageTitle');
  const pageSub = document.getElementById('pageSub');
  let currentCat = 'all';

  function selectCategory(cat) {
    currentCat = cat;
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.cat === cat);
    });
    const meta = categories.find(c => c.id === cat);
    pageTitle.innerHTML = `<i class="fas ${meta.icon}"></i> ${meta.name}`;
    renderApis();
  }

  function renderApis() {
    const list = currentCat === 'all' ? apis : apis.filter(a => a.cat === currentCat);
    pageSub.textContent = `${list.length} free API${list.length!==1?'s':''} · no apikey needed · click Run to test live`;
    apiGrid.innerHTML = '';

    if (!list.length) {
      apiGrid.innerHTML = '<div style="color:var(--muted); padding:2rem;">No APIs in this category yet.</div>';
      return;
    }

    list.forEach(api => {
      const card = document.createElement('div');
      card.className = 'api-card';
      card.innerHTML = `
        <div class="api-top">
          <div class="api-name"><i class="fas ${api.icon}"></i> ${api.name}</div>
          <div class="api-cat">${api.cat}</div>
        </div>
        <div class="api-desc">${api.desc}</div>
        <div class="api-url" title="${api.url}"><i class="fas fa-link" style="opacity:0.5"></i> ${api.url}</div>
        <div class="api-actions">
          <button class="run-btn"><i class="fas fa-play"></i> Run</button>
        </div>
      `;
      card.querySelector('.run-btn').addEventListener('click', (e) => runApi(api, e.currentTarget));
      apiGrid.appendChild(card);
    });
  }

  // ========= RUN API =========
  async function runApi(api, btn) {
    totalRequests++;
    requestCounts[api.name] = (requestCounts[api.name] || 0) + 1;
    reqEl.textContent = totalRequests;

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Running...';

    // open modal with loading
    openModal(api.name);
    const body = document.getElementById('modalBody');
    body.innerHTML = `<div class="loading-spin"><i class="fas fa-spinner fa-spin"></i><div>Calling <b>${api.name}</b>...</div><div style="font-size:0.75rem; margin-top:8px; color:#5a6a99;">${api.url}</div></div>`;

    const startedAt = performance.now();

    try {
      const res = await fetch(api.url, { method:'GET' });
      const ms = Math.round(performance.now() - startedAt);
      const ct = res.headers.get('content-type') || '';

      let html = `
        <div class="modal-meta">
          <span class="meta-tag ${res.ok?'ok':'err'}"><i class="fas ${res.ok?'fa-check-circle':'fa-times-circle'}"></i> Status: ${res.status} ${res.statusText}</span>
          <span class="meta-tag"><i class="fas fa-clock"></i> ${ms}ms</span>
          <span class="meta-tag"><i class="fas fa-file-code"></i> ${ct.split(';')[0] || 'unknown'}</span>
        </div>
      `;

      if (ct.includes('image')) {
        const blob = await res.blob();
        const objUrl = URL.createObjectURL(blob);
        html += `<div class="response-box"><div style="margin-bottom:8px; color:#8fa5ff;">🖼️ Image response (${blob.size} bytes):</div><img src="${objUrl}" alt="API image response"></div>`;
        showToast(`✅ ${api.name} → 200 OK (${ms}ms)`);
      } else if (ct.includes('application/json')) {
        const data = await res.json();
        html += `<div class="response-box">${escapeHtml(JSON.stringify(data, null, 2))}</div>`;
        showToast(`✅ ${api.name} → 200 OK (${ms}ms)`);
      } else {
        const text = await res.text();
        html += `<div class="response-box">${escapeHtml(text.slice(0, 5000))}${text.length>5000?'\n\n... (truncated)':''}</div>`;
        showToast(`✅ ${api.name} → 200 OK (${ms}ms)`);
      }

      body.innerHTML = html;

    } catch (err) {
      const ms = Math.round(performance.now() - startedAt);
      body.innerHTML = `
        <div class="modal-meta">
          <span class="meta-tag err"><i class="fas fa-exclamation-triangle"></i> Request failed</span>
          <span class="meta-tag"><i class="fas fa-clock"></i> ${ms}ms</span>
        </div>
        <div class="response-box" style="color:#f87171;">
          <b>Error:</b> ${escapeHtml(err.message || String(err))}

          <div style="margin-top:1rem; color:#8b97bd;">
            Common causes:
            - CORS policy (browser blocked the request)
            - Network offline
            - Endpoint temporarily down
          </div>
        </div>
      `;
      showToast(`❌ ${api.name} failed`, 'err');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-play"></i> Run';
    }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ========= MODAL =========
  const overlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const closeModal = document.getElementById('closeModal');

  function openModal(title) {
    modalTitle.textContent = title;
    overlay.classList.add('show');
  }
  function hideModal() { overlay.classList.remove('show'); }
  closeModal.addEventListener('click', hideModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) hideModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideModal(); });

  // ========= TOAST =========
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  let toastTimer;
  function showToast(msg, type='ok') {
    toastMsg.textContent = msg;
    toast.querySelector('i').className = type === 'err' ? 'fas fa-times-circle' : 'fas fa-check-circle';
    toast.querySelector('i').style.color = type === 'err' ? '#f87171' : '#4ade80';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // ========= INIT =========
  renderSidebar();
  renderApis();

  // visitors tick
  setInterval(() => {
    if (Math.random() > 0.6) {
      totalVisitors++;
      visEl.textContent = totalVisitors;
    }
  }, 7000);
})();
</script>

</body>
</html>
